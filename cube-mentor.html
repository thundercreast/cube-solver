<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cube Mentor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/*
VOICE: a calm, expert tutor — precise, encouraging, never noisy.
IDEA: a dimly lit study desk with a single lamp on the cube; the cube is the object under the light.
PICTURE: the live 3D cube, floating large under a soft spotlight, always present.
COLOUR and TYPE: deep navy-charcoal ground; the six sticker colours are the only accents (orange for primary actions). Sora headings, Manrope text, JetBrains Mono for notation.
LAYOUT: cube stage left, glass tutor panel right; stacked on narrow screens with the cube on top.
*/
:root{color-scheme:dark;--fh:Sora,Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--bg:#0a0e15;--bg2:#111826;--ink:#e9edf4;--mute:#97a3b6;--line:rgba(255,255,255,.09);--glass:rgba(22,30,45,.62);--acc:#ff6a13;--acc2:#ffd21f;--ok:#2bd17e;--bad:#ff5a5f;--r:14px;--g:#08a65a;--b:#3d7bff;--rd:#e2383f;--y:#ffd21f}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 28% 42%,#1a2538 0%,transparent 60%),radial-gradient(900px 600px at 100% 0%,#141c2b 0%,transparent 55%),var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:var(--fh);line-height:1.1;margin:0 0 .4em;text-wrap:balance;font-weight:600}
h1{font-size:clamp(30px,3.6vw,46px);letter-spacing:-.02em}
h2{font-size:clamp(22px,2.2vw,28px);letter-spacing:-.01em}
h3{font-size:18px}
p{margin:.3em 0 .8em}
code,.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:.92em}
a{color:inherit}
button{font:inherit;color:inherit}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--mute)} .small{font-size:14px} .center{text-align:center;justify-content:center}
.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 max(2vw,14px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;background:rgba(10,14,21,.75);backdrop-filter:blur(14px)}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;font-family:var(--fh);font-weight:600;font-size:18px}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{padding:9px 14px;border-radius:10px;text-decoration:none;color:var(--mute);font-weight:600;font-size:15px}
.nav a:hover{color:var(--ink);background:rgba(255,255,255,.05)}
.nav a[aria-current=page]{color:var(--ink);background:rgba(255,255,255,.08)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,520px);gap:20px;padding:18px max(2vw,14px);height:calc(100vh - 62px)}
body[data-view=scan] .layout{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}
.stage-wrap{position:relative;border-radius:22px;overflow:hidden;background:radial-gradient(60% 55% at 50% 45%,rgba(120,150,210,.16),transparent 70%);min-height:300px}
.stage{position:absolute;inset:0}
.stage canvas{display:block;cursor:grab}
.stage canvas:active{cursor:grabbing}
.gl-fail{padding:30px;color:var(--mute)}
.cube-status{position:absolute;left:16px;top:14px;display:flex;gap:8px;align-items:center;font-size:14px;padding:7px 12px;border-radius:999px;background:rgba(10,14,21,.55);border:1px solid var(--line);backdrop-filter:blur(8px)}
.cube-status .dot{width:9px;height:9px;border-radius:50%;background:var(--acc)}
.cube-status .dot.ok{background:var(--ok)}
.view-btns{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;display:flex;gap:4px;padding:5px;border-radius:12px;background:rgba(10,14,21,.55);border:1px solid var(--line);backdrop-filter:blur(8px)}
.view-btns button{border:0;background:transparent;padding:8px 11px;border-radius:8px;color:var(--mute);cursor:pointer;font-size:14px;min-height:36px;text-transform:capitalize}
.view-btns button:hover{background:rgba(255,255,255,.07);color:var(--ink)}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(18px) saturate(1.2);box-shadow:0 30px 80px -40px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.05)}
.panel{padding:24px;overflow-y:auto;scrollbar-width:thin}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);cursor:pointer;font-weight:600;font-size:15px;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{background:rgba(255,255,255,.1)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#1a0b02}
.btn.primary:hover{background:#ff7d33}
.btn.big{min-height:52px;padding:12px 22px;font-size:16px}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.correct{border-color:var(--ok);background:rgba(43,209,126,.15)}
.btn.wrong{border-color:var(--bad);background:rgba(255,90,95,.15)}
.link{background:none;border:0;padding:6px 2px;color:var(--mute);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px;min-height:36px}
.link:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;margin:10px 0}
.wrap{flex-wrap:wrap}
.pill{font-size:13px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.08)}
.pill.ok{color:var(--ok)}
.hero .lead{font-size:17px;color:#c3ccd9;max-width:56ch}
.how{list-style:none;padding:0;margin:22px 0;display:grid;gap:12px}
.how li{display:flex;gap:14px;align-items:flex-start}
.how .n{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.07);font-family:var(--fh);font-weight:600;font-size:14px}
.how p{margin:0;color:var(--mute);font-size:15px}
.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}
.mode-card{position:relative;text-align:left;padding:16px 16px 16px 18px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.035);cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:transform .15s,border-color .15s}
.mode-card:hover{border-color:color-mix(in srgb,var(--mc) 60%,transparent);transform:translateY(-2px)}
.mode-card strong{font-family:var(--fh);font-size:17px}
.mode-card p{margin:4px 0 0;color:var(--mute);font-size:14px}
.mc-dot{width:14px;height:14px;border-radius:4px;background:var(--mc);box-shadow:0 0 18px var(--mc)}
.mc-prog{font-size:13px;color:var(--ok)}
.tag{font-size:13px;color:var(--mute);font-weight:500;font-family:Manrope,system-ui,sans-serif}
h2 .tag{margin-left:10px}
.mode-head{border-bottom:1px solid var(--line);margin:-4px -4px 16px;padding:0 4px 12px}
.mode-head h2::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--mc);margin-right:10px;vertical-align:middle}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.tabs button{border:0;background:transparent;padding:9px 13px;border-radius:10px;color:var(--mute);cursor:pointer;font-weight:600;font-size:15px;min-height:40px}
.tabs button.on{background:rgba(255,255,255,.09);color:var(--ink)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:rgba(255,255,255,.05);margin:4px 0 14px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;color:var(--mute);cursor:pointer;font-weight:600;font-size:14px;min-height:36px}
.seg button.on{background:rgba(255,255,255,.12);color:var(--ink)}
.empty{padding:20px;border:1px dashed rgba(255,255,255,.16);border-radius:16px}
.ok-box,.err-box{padding:12px 14px;border-radius:12px;margin:10px 0;font-size:15px}
.ok-box{background:rgba(43,209,126,.1);border:1px solid rgba(43,209,126,.35)}
.err-box{background:rgba(255,90,95,.09);border:1px solid rgba(255,90,95,.35)}
.ok-box p,.err-box p{margin:.3em 0 0}
.err-box ul{margin:.4em 0 0;padding-left:1.2em}
/* tutor */
.tutor-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{margin:0;color:var(--mute);font-size:14px}
.move-count{font-size:14px;white-space:nowrap}
.stages{list-style:none;padding:0;margin:12px 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.stages li{flex:none}
.stages li button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.03);padding:6px 10px 6px 6px;border-radius:999px;cursor:pointer;white-space:nowrap;font-size:13px;color:var(--mute);min-height:36px}
.stages li.cur button{border-color:var(--acc);color:var(--ink)}
.stages li.ok button{color:var(--ok)}
.stages .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);font-size:12px;font-weight:700}
.stages li.ok .n{background:rgba(43,209,126,.2)}
.stages li:not(.cur) .lbl{max-width:9ch;overflow:hidden;text-overflow:ellipsis}
.tutor-card{padding:16px;border-radius:16px;background:rgba(0,0,0,.22);border:1px solid var(--line)}
.objective{color:#c9d2df;margin-top:0}
.lesson summary,.lesson-card summary,.pad summary,.history summary{cursor:pointer;font-weight:600;min-height:36px;display:flex;align-items:center}
.lesson{margin:4px 0 10px;font-size:15px;color:#c9d2df}
.step-kind{font-size:13px;font-weight:700;color:var(--acc2);margin-bottom:4px}
.step-kind.rotate{color:#7fb0ff}
.step-text{font-size:17px;margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:"JetBrains Mono",monospace;font-weight:600;font-size:17px;padding:7px 11px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid transparent;transition:all .2s}
.chip.done{opacity:.4}
.chip.active{border-color:var(--acc);background:rgba(255,106,19,.16);transform:translateY(-1px)}
.controls{display:flex;gap:8px;align-items:center;margin:14px 0 6px;flex-wrap:wrap}
.ctl{width:48px;height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);display:grid;place-items:center;cursor:pointer}
.ctl:hover{background:rgba(255,255,255,.1)}
.ctl.play{width:58px;background:var(--acc);border-color:var(--acc);color:#1a0b02}
.ctl:disabled{opacity:.35;cursor:not-allowed}
.slider{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute)}
.slider input{accent-color:var(--acc);width:110px}
.check{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--mute);min-height:36px;cursor:pointer}
.check input{accent-color:var(--acc);width:18px;height:18px}
.pad{margin-top:8px}
.pad-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-top:8px}
.mv{font-family:"JetBrains Mono",monospace;font-weight:600;min-height:40px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer}
.mv:hover{background:rgba(255,255,255,.12)}
/* lessons */
.lesson-card{border:1px solid var(--line);border-radius:14px;padding:6px 14px;margin:8px 0;background:rgba(255,255,255,.025)}
.lesson-card[open]{background:rgba(255,255,255,.04)}
.lc-body{padding:4px 0 10px;font-size:15px;color:#cfd7e3}
.lc-body code{background:rgba(255,255,255,.07);padding:1px 6px;border-radius:6px;white-space:nowrap}
.notation-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.nt{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:10px;background:rgba(0,0,0,.2);font-size:14px}
.nt-btns{display:flex;gap:4px}.nt-btns .mv{flex:1;min-height:38px}
.alg-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.alg-row code{flex:1;min-width:12ch}
.alg-row .num{width:28px;color:var(--mute);font-size:13px}
.case-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:8px 0 16px}
.case{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.case code{font-size:12px;line-height:1.4;color:#c9d2df}
.case strong{font-size:14px}
.grp{font-size:15px;color:var(--mute);margin:14px 0 4px}
.bar-row{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr) 3.5em;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px}
.bar-row b{text-align:right}
.text{flex:1;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.25);color:var(--ink);font:16px "JetBrains Mono",monospace}
.scramble{display:block;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.28);line-height:1.6;word-spacing:4px;font-size:15px}
/* scanning */
.scan-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.scan-progress{display:flex;gap:6px}
.pdot{width:38px;height:38px;border-radius:10px;border:2px solid transparent;background:color-mix(in srgb,var(--c) 30%,#111826);cursor:pointer;font-weight:700;font-size:13px;color:#fff}
.pdot.ok{background:var(--c);color:#000}
.pdot.cur{border-color:#fff}
.scan-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;margin-top:10px}
.cam-box{position:relative;border-radius:16px;overflow:hidden;background:#05070b;aspect-ratio:4/3;display:grid;place-items:center}
.cam-box.small{aspect-ratio:4/3;max-width:420px}
.cam-canvas{width:100%;height:100%;object-fit:contain;display:block;touch-action:none;cursor:move}
.cam-msg{padding:22px;text-align:center;max-width:38ch;color:#c9d2df}
.cam-msg strong{display:block;font-size:17px;margin-bottom:6px;color:var(--ink)}
.cam-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.live-hint{font-size:14px;color:var(--mute);margin-top:8px;min-height:1.5em}
.face-card{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:16px;background:rgba(0,0,0,.2);border:1px solid var(--line)}
.orient{width:96px;height:96px;flex:none}
.orient-t{fill:var(--mute);font-size:9px}
.face-instr p{font-size:15px}
.face-result{display:flex;gap:12px;align-items:center}
.facegrid .st{stroke:rgba(0,0,0,.5);stroke-width:1.5}
.facegrid .st.low{stroke:#fff;stroke-dasharray:4 3;stroke-width:2}
.palette{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:12px;border:2px solid rgba(255,255,255,.18);cursor:pointer}
.sw.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.review{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;margin-top:8px}
.net{width:100%;height:auto}
.net .st{stroke:rgba(0,0,0,.55);stroke-width:1}
.net .st.bad{stroke:#fff;stroke-width:2.2;stroke-dasharray:3 2}
.net-label{fill:rgba(0,0,0,.35);font:700 9px var(--fh);pointer-events:none}
.counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0}
.count{display:flex;gap:8px;align-items:center;font-size:14px;padding:6px 8px;border-radius:9px;background:rgba(255,255,255,.04)}
.count i{width:16px;height:16px;border-radius:4px}
.count.off{outline:1px solid var(--bad);color:var(--bad)}
/* practice */
.timer{display:block;width:100%;font:600 clamp(56px,8vw,92px)/1 "JetBrains Mono",monospace;text-align:center;padding:26px 0;margin:10px 0;border-radius:20px;background:rgba(0,0,0,.25);border:1px solid var(--line);user-select:none;-webkit-user-select:none;cursor:pointer;touch-action:none;color:var(--ink)}
.timer.small{font-size:clamp(36px,5vw,52px);padding:16px 0}
.timer.holding{color:var(--bad)}
.timer.armed{color:var(--ok)}
.timer.inspect{color:var(--acc2)}
.timer.running{color:var(--ink);border-color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:12px 0}
.stat{padding:10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.stat span{display:block;font-size:13px;color:var(--mute)}
.stat b{font:600 18px "JetBrains Mono",monospace;white-space:nowrap}
.history ol{padding-left:2.4em;max-height:320px;overflow:auto}
.history li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:4px 0;border-bottom:1px solid var(--line)}
.hist-btns{margin-left:auto;display:flex;gap:6px}
.drill,.recog{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:10px 0}
.big-alg{font-size:18px;display:block;padding:8px 0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.eff{margin:6px 0}
/* modal, toast */
.modal-wrap{position:fixed;inset:0;background:rgba(3,5,9,.6);display:grid;place-items:center;z-index:50;padding:16px}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto;padding:20px}
.modal-head{display:flex;justify-content:space-between;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:10px;border:0;background:rgba(255,255,255,.06);cursor:pointer;font-size:22px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;max-width:min(640px,92vw);padding:12px 16px;border-radius:12px;background:#1b2434;border:1px solid var(--line);box-shadow:0 20px 50px -20px #000;transition:all .25s;z-index:60;font-size:15px}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.ok{border-color:rgba(43,209,126,.5)} #toast.warn{border-color:rgba(255,90,95,.6)}
@media (max-width:1100px){.scan-grid,.review{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .layout,body[data-view=scan] .layout{grid-template-columns:minmax(0,1fr);height:auto;padding:10px}
  .stage-wrap{height:44vh;min-height:280px;position:sticky;top:62px;z-index:5}
  body[data-view=scan] .stage-wrap{height:30vh}
  .panel{overflow:visible;padding:18px}
}
@media (max-width:600px){
  .top{height:56px}.brand span{display:none}.nav a{padding:8px 10px}
  .stage-wrap{top:56px}
  .mode-grid{grid-template-columns:minmax(0,1fr)}
  .notation-grid{grid-template-columns:minmax(0,1fr)}
  .pad-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .view-btns button{padding:8px 7px}
  .face-card{flex-direction:column}
  .opts{grid-template-columns:minmax(0,1fr)}
  .bar-row{grid-template-columns:minmax(0,7em) minmax(0,1fr) 3em}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-view="home">

 turn, a letter with an apostrophe (<code>R'</code>, said \u201CR prime\u201D) is <b>anticlockwise</b>, and <code>2</code> means a half turn.</p>",faces:[["U","Up \u2014 the top face"],["D","Down \u2014 the bottom face"],["R","Right face"],["L","Left face"],["F","Front \u2014 facing you"],["B","Back \u2014 facing away"],["M","Middle slice, turns like L"],["E","Equator slice, turns like D"],["S","Standing slice, turns like F"],["x","Rotate the whole cube like R"],["y","Rotate the whole cube like U"],["z","Rotate the whole cube like F"]],tip:"<p>Clockwise is judged <i>as if you were looking at that face</i>. So <code>R</code> moves the front stickers up, while <code>L</code> moves them down. Lower-case letters (<code>r</code>) or a \u201Cw\u201D (<code>Rw</code>) turn two layers together.</p>"},zu="<p>A cube has three kinds of pieces. <b>Centres</b> (6) never move relative to each other \u2014 they define each face's colour. <b>Edges</b> (12) have two stickers. <b>Corners</b> (8) have three. You never solve stickers; you put <i>pieces</i> in the right place, the right way round.</p>",nr={beginner:{cross:"<p>Hold white on top. For each white edge, find it, bring it up next to the white centre, and check its other colour matches the side centre. If the edge is on top but its side colour doesn't match, take it down and bring it back up next to the right centre.</p><p>The app plans the shortest moves for each edge on your cube, one edge at a time, without disturbing edges already placed.</p>",corners:"<p>Keep white on top. Turn the cube so the corner's slot is at the <b>front-right</b>. Turn the bottom so the corner is directly underneath, then repeat <code>R' D' R D</code> until it is solved \u2014 1, 3 or 5 times. Each repetition only affects that one corner slot and the bottom layer, so finished corners are safe.</p>",middle:"<p>Flip the cube over (yellow on top). Find a top-layer edge with no yellow. Line its front sticker up with the matching centre (an upside-down T), then send it right with <code>U R U' R' U' F' U F</code> or left with <code>U' L' U L U F U' F'</code>, depending on which side the top sticker's colour belongs to.</p><p>If an edge is stuck in the middle layer the wrong way, insert any top edge into its slot to pop it out.</p>",ycross:"<p>Look only at the yellow edges on top. You'll see a dot, an L, a line, or the cross. <code>F R U R' U' F'</code> moves you forward: dot \u2192 L \u2192 line \u2192 cross. Hold the L at the back-left and the line horizontally.</p>",yface:"<p>The Sune, <code>R U R' U R U2 R'</code>, twists three corners. Count yellow corners on top: with one (a \u201Cfish\u201D), put it at front-left; with none, put a corner with yellow facing left at front-left; with two, put a corner with yellow facing you at front-left. Repeat until the top is yellow.</p>",lcorners:"<p>Look at the sides: two corners with the same colour on one side are \u201Cheadlights\u201D. Put the headlights at the back and do <code>R' F R' B2 R F' R' B2 R2</code>. If there are no headlights, do it once from anywhere and they will appear.</p>",ledges:"<p>Find a side whose edge already matches. Hold it at the back and do <code>R U' R U R U R U' R' U' R2</code>. If the cube isn't solved yet, do it again. If no edge matches, do it once from anywhere first.</p>"},intermediate:{cross:"<p>Build the cross on the <b>bottom</b> so you can see the next pieces while you work. Any cross can be solved in 8 moves or fewer; most take 5\u20137. Plan it during inspection: decide where each white edge goes before turning.</p><p>Watch for edges that can be placed together, and use D turns to bring a slot to the edge rather than the other way round.</p>",f2l:"<p>F2L replaces \u201Ccorner then edge\u201D with one step per slot: join the white corner and its edge in the top layer, then insert them together. Three core ideas:</p><ul><li><b>Basic insert</b>: corner and edge already paired \u2014 <code>U R U' R'</code> or <code>R U R'</code>.</li><li><b>Split and pair</b>: hide the slot with <code>R</code>, move the other piece with <code>U</code>, bring the slot back.</li><li><b>Extract</b>: a piece trapped in a slot comes out with <code>R U R'</code>.</li></ul><p>The app picks a verified algorithm for every case it meets on your cube; try to see why each one works.</p>",eoll:"<p>2-look OLL, first look: orient the edges. Dot: <code>F R U R' U' F' f R U R' U' f'</code>. L shape (held at back-left): <code>f R U R' U' f'</code>. Line (horizontal): <code>F R U R' U' F'</code>.</p>",ocll:"<p>Second look: the seven cross cases (OCLL). Sune and Anti-Sune are the most common; learn them first, then H, Pi, Headlights, Chameleon and Bowtie.</p>",cpll:"<p>2-look PLL, first look: corners. Find headlights. If one side has them, hold it on the left and do the T-perm. If none, the swap is diagonal: Y-perm.</p>",epll:"<p>Second look: edges. Ua and Ub cycle three edges; H swaps opposite pairs; Z swaps adjacent pairs.</p>"},advanced:{cross:"<p>Target: plan the full cross in 15 seconds of inspection. Advanced solvers also track where the first F2L pair is while solving the cross.</p>",f2l:"<p>Full F2L has 41 cases. The goal is to solve them without pausing: look for the next pair while inserting the current one. Prefer algorithms without cube rotations and use the back slots.</p>",oll:"<p>One-look OLL: recognise the pattern of yellow on top and on the sides, apply one of 57 algorithms. Learn by group: OCLL first, then the shapes that reuse familiar triggers (T, P, W, C, fish).</p>",pll:"<p>One-look PLL: 21 cases. Recognise them from two sides using headlights, bars and colour contrast. Finish with an AUF.</p>"}},Vu=[{id:"methods",title:"Methods compared",html:"<p><b>CFOP</b> (cross, F2L, OLL, PLL) is the most popular: about 55\u201360 moves, many algorithms, very fast to recognise and turn.</p><p><b>Roux</b> builds two 1\xD72\xD73 blocks on the left and right, then solves the last-layer corners (CMLL) and finishes the remaining six edges with M and U moves. About 45\u201350 moves, few rotations, but heavy on M-slice turning.</p><p><b>ZZ</b> first orients every edge (EOLine), so the rest of the solve uses only R, U and L turns. F2L becomes rotation-free; the last layer always has a yellow cross already.</p><p><b>Petrus</b> and <b>Mehta</b> are block-building alternatives worth exploring once you know these.</p>"},{id:"roux",title:"Roux in detail",html:"<ol><li><b>First block</b>: a 1\xD72\xD73 block on the left (one centre, two edges, two corners and the line between).</li><li><b>Second block</b>: the matching block on the right, built with R, r, M and U so the first block isn't disturbed.</li><li><b>CMLL</b>: solve the four top corners (42 algorithms, or 2-look with fewer).</li><li><b>LSE</b>: the last six edges, with only M and U \u2014 orient them, place UL/UR, then finish the M slice.</li></ol><p>Use the highlight buttons below to see each block on the 3D cube.</p>"},{id:"zz",title:"ZZ and edge orientation",html:"<p>An edge is <b>\u201Cgood\u201D</b> if it can be solved without F or B quarter turns. Hold white or yellow on top or bottom and green or blue in front. For each edge, find its key sticker: the white/yellow one if it has one, otherwise its green/blue one. In the top or bottom layer the edge is good when the key sticker is on the top or bottom face; in the middle layer it is good when the key sticker is on the front or back face. Everything else is bad. Bad edges always come in pairs (0, 2, 4 \u2026 12).</p><p>The drill below scrambles the cube and asks you to count the bad edges; the app computes the correct answer from the cube state.</p>"},{id:"lookahead",title:"Lookahead",html:"<p>Lookahead means finding the next pieces while your hands finish the current ones. Practise by turning <b>slowly but without pausing</b>: a metronome forces a steady rhythm. Start at 1 turn per beat at 60 bpm and only speed up when every solve flows.</p>"},{id:"fingertricks",title:"Finger tricks",html:"<ul><li><code>U</code> with the right index finger flick; <code>U'</code> with the left index.</li><li><code>R</code> and <code>R'</code> with the wrist, not the fingers.</li><li><code>F</code> with the right thumb from the bottom, or the index finger from the top-front.</li><li><code>D</code> with the left ring finger; <code>M'</code> with the left ring finger pushing up from the back.</li><li>Regrips are slow: choose algorithms that let you keep your grip.</li></ul><p>Use the trigger drills below to time short sequences like <code>R U R' U'</code>.</p>"},{id:"inspection",title:"Inspection strategy",html:"<p>WCA rules give 15 seconds of inspection (over 15 s is +2, over 17 s is DNF). Spend the first 8\u201310 seconds planning the full cross, the rest tracking the first pair. Choose the cross colour that's easiest (colour-neutral solvers check all six).</p>"},{id:"efficiency",title:"Move efficiency",html:"<p>Fewer moves only help if they don't cost thinking time. Typical counts: beginner method 110\u2013150, CFOP 55\u201365, Roux 45\u201350, and the optimal solution for any position is 20 moves or fewer. The app shows all three on your scanned cube.</p>"},{id:"advf2l",title:"Advanced F2L",html:"<ul><li><b>Keyhole</b>: use an empty slot to place a corner or edge without pairing.</li><li><b>Multislotting</b>: set up the next pair while inserting the current one.</li><li><b>Edge control</b>: insert the last pair so the last-layer edges end up oriented.</li><li><b>X-cross</b>: solve the cross and the first pair together during inspection.</li></ul>"}];var ue={cornerInsert:{name:"Corner insert (white on top)",alg:"R' D' R D",note:"Repeat until the white sticker faces up. Each repeat takes the corner out and back in with a twist."},edgeRight:{name:"Second layer \u2014 edge to the right",alg:"U R U' R' U' F' U F"},edgeLeft:{name:"Second layer \u2014 edge to the left",alg:"U' L' U L U F U' F'"},yellowCross:{name:"Yellow cross",alg:"F R U R' U' F'"},sune:{name:"Sune (o
